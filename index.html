<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitFore</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="FitFore: calorie counting, workout plans and golf training in one app. Fitness built for golfers.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" type="image/png" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a coach's clipboard — direct, numbers first, no fuss.
   IDEA: the gym training card: a bold header band, ruled rows, big chalked numbers.
   PICTURE: the calorie ring (today's fuel) and the day's lift card with check-offs.
   COLOUR and TYPE: cobalt band, white card, tangerine accent; Barlow Condensed numerals + Barlow.
   LAYOUT: phone-first single column; sticky date bar and tabs; ring then logging then list. */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5f0,#0a0b09);--card:light-dark(#fff,#151713);--ink:light-dark(#111310,#f1f3ee);
--mute:light-dark(#5e645a,#a3aa9c);--rule:light-dark(#e2e6dc,#272c22);--band:#000;
--acc:#8fdc1a;--ok:light-dark(#4c9400,#9be82a);--warn:#ff6a2b;--soft:light-dark(#edf5e1,#1d2516);--silver:light-dark(#8d939c,#c3c8cf)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
.num,h1,h2,.big{font-family:"Barlow Condensed",Barlow,sans-serif}
header{background:var(--band);color:#fff;padding:10px max(4vw,16px) 0;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;justify-content:center;gap:8px;max-width:760px;margin:0 auto}
.cover{background:#000;display:flex;justify-content:center}
.cover img{display:block;width:100%;max-width:600px;height:auto}
.dnav{display:flex;align-items:center;gap:4px}
.dnav button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;min-width:44px;height:44px;font-size:20px;cursor:pointer}
.dnav span{font:700 18px "Barlow Condensed";min-width:92px;text-align:center}
nav{display:flex;max-width:760px;margin:6px auto 0;overflow-x:auto}
nav a{flex:1;text-align:center;color:rgba(255,255,255,.75);text-decoration:none;padding:12px 6px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav a.on{color:#fff;border-color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:16px max(4vw,12px) 64px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid var(--rule)}
h2{font-size:24px;margin:0 0 10px;line-height:1.1}
.note{font-size:14px;color:var(--mute)}
#msg{display:none;background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.hero{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:center}
.ring{position:relative;width:200px;height:200px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big{font-size:52px;font-weight:800;line-height:1}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule)}
.stat b{font:700 20px "Barlow Condensed";white-space:nowrap}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:16px Barlow,sans-serif;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);min-height:44px}
textarea{min-height:90px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.row{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:10px;min-height:44px;padding:0 16px;font:600 16px Barlow,system-ui,sans-serif;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink)}.btn.hot{background:var(--acc);color:#0a0a0a}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--soft);border:0;color:var(--ink);border-radius:999px;padding:8px 12px;min-height:40px;font:500 14px Barlow,system-ui,sans-serif;cursor:pointer}
.chip.on{background:var(--acc);color:#0a0a0a}
.meal{font:700 18px "Barlow Condensed";margin:14px 0 2px;display:flex;justify-content:space-between;color:var(--mute)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.item .n{flex:1}.item .k{font:700 20px "Barlow Condensed";white-space:nowrap;text-align:right}
.x{background:none;border:0;color:var(--mute);width:44px;height:44px;font-size:22px;cursor:pointer;flex:none}
.ex{display:grid;grid-template-columns:44px minmax(0,1fr) 96px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.ex input[type=checkbox]{width:28px;height:28px;min-height:0;accent-color:var(--acc);justify-self:center}
.ex .sr{font:700 18px "Barlow Condensed";color:var(--ok);white-space:nowrap}
.ex.done .nm{text-decoration:line-through;color:var(--mute)}
.ex input.w{padding:8px;text-align:right}
.edit{border:1px dashed var(--rule);border-radius:12px;padding:12px;margin-top:12px}
.xlist{margin-top:12px}
.lib{border:2px solid var(--acc);border-radius:14px;padding:12px;margin-top:12px;background:var(--card)}
.libh{display:flex;justify-content:space-between;align-items:center;font:700 20px "Barlow Condensed",sans-serif}
.lib .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.lib .chip{flex:none}
.libl{max-height:52vh;overflow-y:auto;margin-top:8px;border-top:1px solid var(--rule)}
.li{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 4px;min-height:56px;color:var(--ink);font:16px Barlow,system-ui,sans-serif;cursor:pointer}
.li>span{display:flex;flex-direction:column}.li .note{font-size:13px}
.li i{flex:none;width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;font-weight:700}
.li.on{background:var(--soft)}.li.on i{background:var(--acc);color:#000}
.libf{position:sticky;bottom:0;background:var(--card);padding-top:10px;display:flex;gap:8px}.libf .btn:first-child{flex:1}
.timer .ttop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tbig{font:800 56px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.5px;margin:4px 0}
.timer.run{background:#000;color:#fff;border-color:var(--acc)}.timer.run .note{color:#c9cec3}.timer.run .tbig{color:var(--acc)}
.tbtns{display:flex;flex-direction:column;gap:8px;min-width:150px}.btn.big{min-height:52px;font-size:17px}
.pill{display:flex;align-items:center;gap:6px;background:var(--acc);color:#000;text-decoration:none;font:700 17px "Barlow Condensed",sans-serif;padding:8px 12px;border-radius:999px;font-variant-numeric:tabular-nums;margin-right:auto}
.pill i{width:9px;height:9px;border-radius:50%;background:#000}
@media(prefers-reduced-motion:no-preference){.pill i{animation:blink 1.2s infinite}}@keyframes blink{50%{opacity:.25}}
.gw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 8px;text-align:center}
.gw b{display:block;font:800 34px "Barlow Condensed",sans-serif;line-height:1}.gw span{font-size:13px;color:var(--mute)}
.gw div:nth-child(2) b{color:var(--ok)}
.ck{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:520px){.ck{grid-template-columns:1fr}}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;border:2px dashed var(--rule);border-radius:14px;cursor:pointer;font-weight:700;color:var(--ink);text-align:center;padding:12px}
.drop:hover,.drop:focus-within{border-color:var(--acc)}
.fbtn{display:inline-flex;align-items:center}
.ph{display:block;padding:0;border:0;background:none;cursor:zoom-in;border-radius:12px;overflow:hidden;width:100%}
.ph img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:12px}
.ph.sm{width:52px;height:52px;flex:none}.ph.sm img{width:52px;height:52px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cmp figure{margin:0}.cmp figcaption{font-size:14px;color:var(--mute);margin-top:4px}
.cmp .ph img{max-height:none;aspect-ratio:3/4}
.trend{display:flex;align-items:flex-end;gap:6px;height:170px;overflow-x:auto;padding-top:6px}
.tc{flex:1 0 40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.tc i{display:block;width:70%;background:var(--ok);border-radius:6px 6px 2px 2px;min-height:8px}
.tc b{font:700 14px "Barlow Condensed",sans-serif}.tc span{font-size:12px;color:var(--mute);white-space:nowrap}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lb img{max-width:100%;max-height:80vh;border-radius:12px}
.wtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.wtop h2{margin:0}
.wbig{font:800 34px "Barlow Condensed",sans-serif}
.wbar{height:14px;margin:8px 0 6px}.wbar i{background:#29b6e8}
.wq{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.wq .btn{padding:0 4px}.wcust{flex-wrap:nowrap}.wcust input{flex:1;min-width:0}
.rec{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--rule);border-radius:12px;margin-top:8px;cursor:pointer;color:var(--ink);font-size:16px}
.rec input{width:26px;height:26px;min-height:0;flex:none;accent-color:var(--acc)}
.rec>span{display:flex;flex-direction:column}.rec.on{border-color:var(--acc);background:var(--soft)}
.xt{display:flex;gap:10px;align-items:center}
details.how{grid-column:1/-1;margin-top:-4px;padding-left:54px}details.how>summary{cursor:pointer;color:var(--ok);font-weight:600;font-size:14px;min-height:32px;display:flex;align-items:center}
.howb{padding:8px 0}
.howb ol,.howb ul{margin:0 0 8px;padding-left:20px;font-size:15px}.howb li{margin-bottom:3px}
.vid{color:var(--ok);font-weight:600}
@media(max-width:480px){details.how{padding-left:0}}
.xe{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.xe.dragging{box-shadow:0 10px 28px rgba(0,0,0,.25);border-color:var(--acc);position:relative;z-index:2}
.xh{display:grid;grid-template-columns:32px minmax(0,1fr) 44px 44px;gap:6px;align-items:center}
.xh input{font-weight:600}
.grip{font-size:22px;color:var(--mute);cursor:grab;touch-action:none;user-select:none;text-align:center;line-height:44px}
.mv{background:var(--soft);border:0;border-radius:10px;height:44px;font-size:18px;color:var(--ink);cursor:pointer}.mv:disabled{opacity:.3}
.xg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media(max-width:420px){.xg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}select.sm{width:auto;min-height:40px;font-size:14px;padding:6px 10px}
details.dayed{border:1px solid var(--rule);border-radius:14px;padding:12px;margin-top:12px;background:var(--bg)}
details.dayed>summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;font:700 20px "Barlow Condensed",sans-serif;min-height:40px;list-style:none}
details.dayed>summary::-webkit-details-marker{display:none}
.wk{display:grid;grid-template-columns:54px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:8px 0}
.wk .tr{height:26px;background:var(--soft);border-radius:6px;position:relative;overflow:hidden}
.wk .tr i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:6px}
.wk .tr i.over{background:var(--warn)}
.wk .gl{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.wk b{font:700 18px "Barlow Condensed";text-align:right;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-left:4px}
.est .item .k input{width:80px;text-align:right;padding:6px}
.hide{display:none!important}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#000;color:#fff;border:1px solid var(--acc);padding:10px 18px;border-radius:999px;font:600 15px Barlow,system-ui,sans-serif;opacity:0;pointer-events:none;z-index:20;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.wait{color:#cfd3cb}#toast.bad{border-color:var(--warn);color:#ffd2bf}
@media(prefers-reduced-motion:no-preference){#toast{transition:opacity .2s,transform .2s}}
details.dr{border-bottom:1px solid var(--rule);padding:10px 0}
details.dr summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-weight:600;min-height:32px;align-items:center}
details.dr summary::-webkit-details-marker{display:none}
details.dr summary b{}details.dr .tag{font:600 13px Barlow,system-ui,sans-serif;color:var(--mute);white-space:nowrap}
details.dr p{margin:6px 0}
.gs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.gs div{background:var(--soft);border-radius:12px;padding:10px 12px}
.gs b{display:block;font:800 28px "Barlow Condensed";line-height:1.1}
.gs span{font-size:13px;color:var(--mute)}
@media(max-width:600px){.hero{grid-template-columns:1fr;justify-items:center}.hero>div:last-child{width:100%}.dnav span{min-width:76px}}
@media(prefers-reduced-motion:no-preference){.ring circle.v{transition:stroke-dashoffset .6s ease}}
body.out header,body.out main,body.out .legal.inapp{display:none}
#auth{display:none;max-width:440px;margin:0 auto;padding:18px 16px 32px}
body.out #auth{display:block}
#auth h2{margin-top:4px}#auth .btn{width:100%;margin-top:14px}
.linkb{background:none;border:0;color:var(--ok);font:600 15px Barlow,system-ui,sans-serif;cursor:pointer;padding:10px 0;min-height:44px}
#amsg{display:none;background:var(--soft);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px}
.legal{text-align:center;font-size:13px;color:var(--mute);padding:0 16px 32px}.legal a{color:var(--mute)}
</style>
</head>
<body>
<div class="cover"><img src="img/logo.jpg" alt="FitFore — Fitness built for golfers" width="1536" height="1024"></div>
<section id="auth" aria-live="polite"></section>
<header>
  <div class="top">
    <a id="pill" class="pill hide" href="#workout"><i></i><span id="pillt">0:00</span></a><div class="dnav"><button id="prev" aria-label="Previous day">‹</button><span id="dlabel">Today</span><button id="next" aria-label="Next day">›</button></div>
  </div>
  <nav><a href="#food" data-t="food">Food</a><a href="#workout" data-t="workout">Workout</a><a href="#golf" data-t="golf">Golf</a><a href="#week" data-t="week">Week</a><a href="#setup" data-t="setup">Goals</a></nav>
</header>
<main>
  <div id="msg"></div>
  <section id="food"></section>
  <section id="workout" class="hide"></section>
  <section id="golf" class="hide"></section>
  <section id="week" class="hide"></section>
  <section id="setup" class="hide"></section>
</main>
<p class="legal">FitFore gives general fitness information, not medical advice. <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
<div id="toast" role="status" aria-live="polite"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=0)=>{const n=parseFloat(v);return isFinite(n)?n:d};
const cl=o=>JSON.parse(JSON.stringify(o));
const key=d=>d.toLocaleDateString('en-CA');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MEALS=['Breakfast','Lunch','Dinner','Snack'];
const DEF={settings:{goal:2200,protein:160,water:100,sex:'m',age:45,heightIn:72,weightLb:'',activity:1.375,pace:-500},plan:{days:[]},foods:{list:[]}};
const S={settings:cl(DEF.settings),plan:cl(DEF.plan),foods:cl(DEF.foods),days:{},golf:{},weeks:{}};
let cur=new Date(),db=null,sample=null,tab='food',editing=false,est=null,busyAI=false,dirty=false;
let sb=null,user=null,recovering=/type=recovery/.test(location.hash);

function note(t){const m=$('#msg');m.textContent=t||'';m.style.display=t?'block':'none'}

/* ---------- storage ---------- */
const LS='fuel-train-v1';
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LS)||'null');if(o)for(const k of ['settings','plan','foods','days','golf','weeks'])if(o[k])S[k]=o[k]}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){note('This device is out of storage space — remove an old progress photo to keep saving.')}}
const q={},busy={},DELETE={del:1};
function put(path,data){
  if(path.startsWith('days/'))S.days[path.slice(5)]=data;
  else if(path.startsWith('golf/')){if(data)S.golf[path.slice(5)]=data;else delete S.golf[path.slice(5)]}
  else if(path.startsWith('weeks/')){if(data)S.weeks[path.slice(6)]=data;else delete S.weeks[path.slice(6)]}
  else S[path.slice(4)]=data;
  render();
  if(!db){lsSave();toast('Saved on this device ✓');return}
  q[path]=data===null?DELETE:data;flush(path);
}
let tT;
function toast(s,cls){const t=$('#toast');t.textContent=s;t.className='show '+(cls||'');clearTimeout(tT);if(cls!=='wait')tT=setTimeout(()=>t.className='',cls==='bad'?4000:1600)}
let failed=false;
async function flush(p){
  if(busy[p])return;busy[p]=1;toast('Saving…','wait');
  while(q[p]){const d=q[p];delete q[p];
    try{d===DELETE?await db.doc(p).delete():await db.doc(p).set(d)}catch(e){failed=true;note(e&&e.code==='quota_exceeded'?'Storage is full — delete some old days.':'Couldn\'t save that change. Check your connection and try again.')}}
  busy[p]=0;
  if(!Object.values(busy).some(Boolean)){toast(failed?'Not saved — check your connection':'Saved ✓',failed?'bad':'');failed=false}
}

/* ---------- helpers ---------- */
const dk=()=>key(cur);
const dayOf=k=>S.days[k]||{items:[],done:{},lifts:{},wd:null};
function editDay(fn){const d=cl(dayOf(dk()));d.items=d.items||[];d.done=d.done||{};d.lifts=d.lifts||{};fn(d);put('days/'+dk(),d)}
const sum=(a,f)=>a.reduce((t,x)=>t+num(x[f]),0);
function mealNow(){const h=new Date().getHours()+new Date().getMinutes()/60;return h<10.5?'Breakfast':h<15?'Lunch':h<20.5?'Dinner':'Snack'}
function remember(items){const f=cl(S.foods);f.list=f.list||[];
  for(const it of items){const n=it.name.trim();if(!n)continue;f.list=f.list.filter(x=>x.name.toLowerCase()!==n.toLowerCase());f.list.unshift({name:n,cal:num(it.cal),p:num(it.p)})}
  f.list=f.list.slice(0,40);put('app/foods',f)}
function addItems(items,meal){
  items=items.filter(i=>String(i.name||'').trim());if(!items.length)return;
  editDay(d=>{for(const i of items)d.items.push({id:uid(),name:String(i.name).trim().slice(0,80),cal:Math.round(num(i.cal)),p:Math.round(num(i.p)),meal})});
  remember(items);
}
function calc(s){
  const kg=num(s.weightLb)*0.4536,cm=num(s.heightIn)*2.54;if(!kg||!cm||!num(s.age))return null;
  const bmr=10*kg+6.25*cm-5*num(s.age)+(s.sex==='f'?-161:5),tdee=bmr*num(s.activity,1.375);
  let t=Math.round((tdee+num(s.pace))/10)*10;const floor=s.sex==='f'?1200:1500,low=t<floor;if(low)t=floor;
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),t,low,floor};
}

async function shrink(file){
  const url=URL.createObjectURL(file);try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    for(const [m,q] of [[900,.72],[720,.65],[560,.6]]){const sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const d=c.toDataURL('image/jpeg',q);if(d.length<190000)return d}
    return null}finally{URL.revokeObjectURL(url)}}

const FOCUS={balanced:['putt','short','iron','driver','fit'],driver:['driver','driver','iron','fit','putt'],iron:['iron','iron','short','driver','putt'],short:['short','short','putt','short','iron'],putt:['putt','putt','putt','short','short'],fit:['fit','fit','fit','fit','fit'],mental:['mental','iron','putt','mental','short']};

function suggest(){
  const n={20:2,45:3,60:4,90:5}[gMin]||3,seed=Math.floor(new Date(dk())/864e5)+Math.floor(Math.random()*7),used=new Set();
  const items=FOCUS[gFocus].slice(0,n).map((c,i)=>{const pool=DRILLS.filter(d=>d.cat===c&&!used.has(d.id));const d=pool[(seed+i*3)%pool.length];used.add(d.id);return{name:d.name,cat:d.cat,how:d.how,goal:d.goal,min:Math.round(gMin/n)}});
  editDay(d=>d.golf={focus:FNAME[gFocus],min:gMin,items,done:{}});
}
function gStats(){
  const all=Object.entries(S.golf).map(([id,x])=>({id,...x})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||num(b.t)-num(a.t));
  const now=new Date(),ago=n=>{const d=new Date(now);d.setDate(d.getDate()-n);return key(d)};
  const prac=all.filter(x=>x.type!=='Round'),rounds=all.filter(x=>x.type==='Round'&&num(x.score));
  const r5=rounds.slice(0,5),f=x=>num(x.holes,18)===9?2:1;
  const avg=(a,fn)=>a.length?a.reduce((t,x)=>t+fn(x),0)/a.length:null;
  const fr=rounds.filter(x=>num(x.firOf)),gr=rounds.filter(x=>x.gir!==''&&x.gir!=null);
  return{all,week:all.filter(x=>x.date>=ago(6)).length,mins:sum(prac.filter(x=>x.date>=ago(29)),'min'),
    score:avg(r5,x=>num(x.score)*f(x)),putts:avg(rounds.filter(x=>num(x.putts)).slice(0,5),x=>num(x.putts)*f(x)),
    fir:fr.length?sum(fr,'fir')/sum(fr,'firOf')*100:null,gir:gr.length?sum(gr,'gir')/gr.reduce((t,x)=>t+num(x.holes,18),0)*100:null,n:rounds.length};
}

async function coach(){
  const t=$('#gc').value.trim();if(!t||busyAI)return;busyAI=true;document.activeElement.blur();render();
  try{
    const lib=DRILLS.map(x=>x.name+' ('+GCAT[x.cat]+')').join('; ');

    if(items.length){editDay(d=>d.golf={focus:'Coach session',min:gMin,summary:String(r.summary||'').slice(0,300),items,done:{}});note('')}
    else note('Couldn\'t build a session from that — try describing your misses in a bit more detail.');
  }catch(e){handleAI(e)}
  busyAI=false;render();
}

    const add=LIB.filter(x=>libSel.has(x[0]));for(const x of add)ex.push({id:uid(),name:x[0],sets:x[3],reps:x[4],target:'',rest:'',note:''});
    const n=add.length;libSel=new Set();libDay=null;savePlan(p);toast(n+' exercise'+(n>1?'s':'')+' added')}
  else if(D.ax!=null){const p=cl(S.plan);p.days[D.ax].exercises=p.days[D.ax].exercises||[];p.days[D.ax].exercises.push(newEx());savePlan(p)}
  else if(D.rx){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to remove';b.classList.add('hot');return}const[a,c]=D.rx.split(':');const p=cl(S.plan);p.days[a].exercises.splice(c,1);savePlan(p)}
  else if(D.rd!=null){if(b.dataset.sure){const p=cl(S.plan);p.days.splice(D.rd,1);savePlan(p)}else{b.dataset.sure=1;b.textContent='Tap again to delete';b.classList.add('hot')}}
  else if(D.gmin){gMin=num(D.gmin);render()}
  else if(D.gf){gFocus=D.gf;render()}
  else if(D.gcat){gCat=D.gcat;render()}
  else if(b.id==='gsug')suggest();
  else if(b.id==='gcb')coach();
  else if(b.id==='gsave')saveGolf();
  else if(b.id==='gclr')editDay(d=>{delete d.golf});
  else if(D.gadd){const x=DRILLS.find(z=>z.id===D.gadd);editDay(d=>{if(!d.golf||d.golf.logged)d.golf={focus:'My plan',min:0,items:[],done:{}};d.golf.items.push({name:x.name,cat:x.cat,how:x.how,goal:x.goal,min:10});d.golf.min=sum(d.golf.items,'min')});note(x.name+' added to today\'s plan.');scrollTo({top:0,behavior:'smooth'})}
  else if(b.id==='glogp'){const g=dayOf(dk()).golf;const dn=g.items.filter((x,i)=>g.done&&g.done[i]);const cats=[...new Set((dn.length?dn:g.items).map(x=>x.cat))];
    const type=cats.every(c=>c==='fit')?'Golf fitness':cats.every(c=>c==='putt')?'Putting':cats.every(c=>c==='putt'||c==='short')?'Short game':'Range';
    put('golf/'+uid(),{date:dk(),type,t:Date.now(),min:num(g.min),drills:dn.map(x=>x.name),notes:''});editDay(d=>{d.golf.logged=true});note('Session logged.')}
  else if(D.gdel){if(b.dataset.sure)put('golf/'+D.gdel,null);else{b.dataset.sure=1;b.textContent='?';b.setAttribute('aria-label','Tap again to delete');b.style.color='var(--warn)'}}
  else if(b.id==='signout'){sb.auth.signOut()}
  else if(b.id==='wipe'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to delete everything';b.classList.add('hot');return}wipeAll()}
  else if(b.id==='usec'){const s=cl(S.settings);s.goal=num(D.v);put('app/settings',s);note('Goal set to '+num(D.v).toLocaleString()+' calories.')}
});
let typeT;
document.addEventListener('input',e=>{const t=e.target;if(t.tagName!=='INPUT'||!(t.dataset.s||t.dataset.pe||t.dataset.pd!=null||t.dataset.lift!=null))return;
  clearTimeout(typeT);typeT=setTimeout(()=>{if(t.isConnected&&t.value!==t.dataset.sv){t.dataset.sv=t.value;fieldSave({target:t})}},1200)});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset&&t.dataset.import!=null){const f=t.files&&t.files[0];t.value='';if(f)importFile(f);return}
  if(t.dataset&&t.dataset.photo!=null){const f=t.files&&t.files[0];if(!f)return;photoBusy=true;render();
    try{const d=await shrink(f);if(d)saveWeek('photo',d);else note('That photo is too large — try a different one.')}catch(x){note('Couldn\'t read that photo — try a JPEG or PNG.')}
    photoBusy=false;render();return}
  if(t.dataset&&t.value===t.dataset.sv)return;fieldSave(e)});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.wk)return;clearTimeout(typeT);
  typeT=setTimeout(()=>{if(t.isConnected&&t.value!==t.dataset.sv){t.dataset.sv=t.value;fieldSave({target:t})}},1200)});
document.addEventListener('input',e=>{if(e.target.id!=='libq')return;libQ=e.target.value;const l=$('#liblist');if(l){l.innerHTML=libList();l.scrollTop=0}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&bigPhoto){bigPhoto=null;render()}});
document.addEventListener('click',e=>{const p=e.target.closest('#pill');if(!p)return;e.preventDefault();cur=new Date(p.dataset.day+'T12:00');if(location.hash!=='#workout')location.hash='workout';else render()});
setInterval(()=>{document.querySelectorAll('[data-tick]').forEach(el=>{const d=S.days[el.dataset.tick];if(d&&d.timer)el.textContent=fmtT(tEl(d.timer))});
  const rk=runningDay();if(rk)$('#pillt').textContent=fmtT(tEl(S.days[rk].timer));},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
function fieldSave(e){const t=e.target,D=t.dataset;
  if(D.wk){saveWeek(D.wk,D.wk==='weight'?(t.value===''?'':Math.round(num(t.value)*10)/10):t.value.slice(0,2000));return}
  if(D.done)editDay(d=>{d.done[D.done]=t.checked});
  else if(D.rec){editDay(d=>{d.recovery={...(d.recovery||{}),[D.rec]:t.checked}})}
  else if(D.gd!=null)editDay(d=>{d.golf.done=d.golf.done||{};d.golf.done[D.gd]=t.checked});
  else if(D.gtype!=null){gType=t.value;t.blur();render()}
  else if(D.lift!=null)editDay(d=>{d.lifts[D.lift]=t.value.slice(0,20)});
  else if(D.s){const s=cl(S.settings);s[D.s]=(t.tagName==='SELECT'&&D.s==='sex')||t.type==='date'?t.value:num(t.value,'');
    if(D.s==='goalWeight'&&num(t.value)&&!num(s.startWeight)){const c=firstWeight();if(c)s.startWeight=c}put('app/settings',s)}
  else if(D.pd!=null){const p=cl(S.plan);p.days[D.pd][D.f]=t.value.slice(0,200);savePlan(p)}
  else if(D.pe){const[a,c]=D.pe.split(':');const p=cl(S.plan),x=p.days[a].exercises[c];if(D.f==='name'&&x.name!==t.value)delete x.tips;x[D.f]=t.value.slice(0,D.f==='note'?200:80);savePlan(p)}
  else if(D.tx){if(t.value==='')return;const[a,c]=D.tx.split(':').map(Number);const p=cl(S.plan),[e]=p.days[a].exercises.splice(c,1);p.days[Number(t.value)].exercises.push(e);t.blur();savePlan(p);note(e.name+' moved to '+p.days[Number(t.value)].name+'.')}
}
let drag=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-grip]');if(!g)return;const row=g.closest('.xe');e.preventDefault();
  drag={row,list:row.parentNode,id:e.pointerId};row.classList.add('dragging');g.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;e.preventDefault();
  if(e.clientY<90)scrollBy(0,-14);else if(e.clientY>innerHeight-70)scrollBy(0,14);
  const sibs=[...drag.list.children].filter(r=>r!==drag.row);let before=null;
  for(const r of sibs){const b=r.getBoundingClientRect();if(e.clientY<b.top+b.height/2){before=r;break}}
  if(before!==drag.row.nextSibling)drag.list.insertBefore(drag.row,before)});
function endDrag(){if(!drag)return;const{row,list}=drag;drag=null;row.classList.remove('dragging');
  const order=[...list.children].map(r=>Number(r.dataset.ei)),di=Number(list.dataset.day);
  if(order.every((v,i)=>v===i)){render();return}
  const p=cl(S.plan);p.days[di].exercises=order.map(i=>p.days[di].exercises[i]);savePlan(p)}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty)render()},0));
function route(){const h=location.hash.slice(1);tab=['food','workout','golf','week','setup'].includes(h)?h:'food';render()}
addEventListener('hashchange',route);
route();

/* ---------- start: accounts, saving and AI ---------- */
async function api(path,body){
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(session?session.access_token:'')},body:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(j.error||'Request failed');e.code=j.code||(r.status===429?'rate_limited':'failed');throw e}
  return j;
}
function makeDb(){return{doc:p=>({
  set:async d=>{const{error}=await sb.from('docs').upsert({user_id:user.id,path:p,data:d,updated_at:new Date().toISOString()});if(error)throw error},
  delete:async()=>{const{error}=await sb.from('docs').delete().eq('user_id',user.id).eq('path',p);if(error)throw error}})}}
function resetState(){S.settings=cl(DEF.settings);S.plan=cl(DEF.plan);S.foods=cl(DEF.foods);S.days={};S.golf={};S.weeks={}}
async function loadAll(){
  const rows=[];
  for(let from=0;;from+=1000){const{data,error}=await sb.from('docs').select('path,data').order('path').range(from,from+999);if(error)throw error;rows.push(...data);if(data.length<1000)break}
  resetState();
  for(const{path,data}of rows){const i=path.indexOf('/'),a=path.slice(0,i),b=path.slice(i+1);
    if(a==='app'&&DEF[b])S[b]={...cl(DEF[b]),...data};else if(a==='days'||a==='golf'||a==='weeks')S[a][b]=data}
}
const PATH_OK=/^(app\/(settings|plan|foods)|days\/\d{4}-\d{2}-\d{2}|golf\/[\w-]{1,40}|weeks\/\d{4}-\d{2}-\d{2})$/;
async function importFile(f){
  if(f.size>20e6){note('That file is too big to import.');return}
  let o;try{o=JSON.parse(await f.text())}catch(e){note('That file isn\'t a FitFore data file.');return}
  const docs=o&&o.docs&&typeof o.docs==='object'?Object.entries(o.docs).filter(([p,d])=>PATH_OK.test(p)&&d&&typeof d==='object'):[];
  if(!docs.length){note('No FitFore data found in that file.');return}
  toast('Importing…','wait');let bad=0;
  for(const[p,d]of docs){try{await db.doc(p).set(d)}catch(e){bad++}}
  try{await loadAll()}catch(e){}
  render();toast(bad?'Some items didn\'t import':'Imported ✓',bad?'bad':'');
  note(bad?`Imported ${docs.length-bad} of ${docs.length} items. Try the file again to finish.`:`Imported ${docs.length} items. Your plan, foods and logs are in.`);
}
async function wipeAll(){
  const{error}=await sb.from('docs').delete().eq('user_id',user.id);
  if(error){note('Couldn\'t delete your data. Check your connection and try again.');return}
  resetState();render();note('All your FitFore data was deleted.');
}

const A=$('#auth');let aMode='in';
function showAuth(on){document.body.classList.toggle('out',on)}
function aMsg(t){const m=$('#amsg');if(m){m.textContent=t||'';m.style.display=t?'block':'none'}}
function authUI(mode,msg){aMode=mode;
  const T={in:['Sign in','Sign in'],up:['Create your account','Create account'],reset:['Reset your password','Email me a reset link'],newpw:['Choose a new password','Save new password']}[mode];
  A.innerHTML=`<div class="card"><h2>${T[0]}</h2>
    ${mode==='up'?'<p class="note">Calorie counting, workout plans and golf training in one place. Free to start.</p>':''}
    <form id="af">
      ${mode!=='newpw'?'<label for="ae">Email</label><input id="ae" type="email" autocomplete="email" required>':''}
      ${mode==='in'||mode==='up'||mode==='newpw'?`<label for="ap">Password</label><input id="ap" type="password" minlength="8" autocomplete="${mode==='in'?'current-password':'new-password'}" required>${mode!=='in'?'<p class="note">At least 8 characters.</p>':''}`:''}
      ${mode==='up'?'<label class="rec" style="margin-top:12px"><input type="checkbox" id="aok" required><span class="note">I\'m 18 or older and agree to the <a href="terms.html" target="_blank">Terms</a> and <a href="privacy.html" target="_blank">Privacy policy</a>.</span></label>':''}
      <div id="amsg"></div>
      <button class="btn hot big" type="submit">${T[1]}</button>
    </form>
    ${mode==='in'?'<button class="linkb" data-am="up">New here? Create an account</button><br><button class="linkb" data-am="reset">Forgot your password?</button>':''}
    ${mode==='up'||mode==='reset'?'<button class="linkb" data-am="in">Already have an account? Sign in</button>':''}
  </div>`;
  aMsg(msg);
}
A.addEventListener('click',e=>{const b=e.target.closest('[data-am]');if(b){e.preventDefault();authUI(b.dataset.am)}});
A.addEventListener('submit',async e=>{e.preventDefault();if(!sb)return;
  const btn=A.querySelector('button[type=submit]'),em=($('#ae')||{}).value,pw=($('#ap')||{}).value;btn.disabled=true;aMsg('Working…');
  try{
    if(aMode==='in'){const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error;aMsg('')}
    else if(aMode==='up'){const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin}});if(error)throw error;
      if(!data.session){authUI('in','Check your email and tap the confirmation link, then sign in here.');return}}
    else if(aMode==='reset'){const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin});if(error)throw error;authUI('in','If that email has an account, a reset link is on its way.');return}
    else if(aMode==='newpw'){const{data,error}=await sb.auth.updateUser({password:pw});if(error)throw error;recovering=false;history.replaceState(null,'',location.pathname);signedIn(data.user);return}
  }catch(x){aMsg(x&&x.message?x.message:'That didn\'t work. Try again.')}
  btn.disabled=false;
});

async function signedIn(u){
  if(user&&user.id===u.id)return;user=u;
  aMsg('Loading your log…');
  try{await loadAll()}catch(e){user=null;showErr('Couldn\'t load your data.',e);return}
  db=makeDb();
  sample={run:async(task,input)=>{const j=await api('/api/ai',{task,input});return j.result}};
  showAuth(false);note('');render();
}
function showErr(msg,e){showAuth(true);const d=e&&(e.message||e.code||String(e));
  A.innerHTML=`<div class="card"><h2>Something went wrong</h2><p>${esc(msg)}</p>${d?`<p class="note">Details: ${esc(d)}</p>`:''}
    <div class="btns"><button class="btn hot" data-retry>Try again</button>${sb?'<button class="btn alt" data-so>Sign out</button>':''}</div></div>`}
A.addEventListener('click',e=>{if(e.target.closest('[data-retry]'))location.reload();else if(e.target.closest('[data-so]'))sb.auth.signOut().finally(()=>location.reload())});
function signedOut(){user=null;db=null;sample=null;est=null;editing=false;resetState();showAuth(true);authUI('in')}

(async()=>{
  showAuth(true);A.innerHTML='<p class="note" style="text-align:center">Loading…</p>';
  setTimeout(()=>{if(document.body.classList.contains('out')&&!A.querySelector('form,.card'))showErr('FitFore is taking too long to load. Check your connection.',null)},20000);
  try{
    const cfg=await (await fetch('/api/config')).json();
    if(!cfg.url||!cfg.anonKey)throw new Error('missing');
    const{createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
    sb=createClient(cfg.url,cfg.anonKey);
  }catch(e){showErr('FitFore can\'t reach its server settings. If you run this site, check the Supabase settings in Vercel and redeploy.',e);return}
  sb.auth.onAuthStateChange((ev,ses)=>{
    if(ev==='PASSWORD_RECOVERY'){recovering=true;showAuth(true);authUI('newpw');return}
    if(ses&&ses.user){if(!recovering)setTimeout(()=>signedIn(ses.user),0)}
    else signedOut();
  });
})();
}
</script>
